[project]
name = "ratbot"
version = "0.1.0"
description = "the ONLY discord bot"
readme = "README.md"
authors = [{ name = "Ernie Izdebski", email = "izdebski@andrews.edu" }]
requires-python = ">=3.15"
dependencies = [
    "cyclopts>=4.20.0",
    "discord-py>=2.7.1",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
ratbot = "ratbot:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pip>=26.2.1",
]

[tool.ruff]
line-length = 90

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 90

[tool.basedpyright]
reportImplicitStringConcatenation = false
pythonVersion = "3.15"
